# ducking — doc-steward exemptions

no-readme ducking_core          # documented in AGENTS.md and README.md (canonical package); a subfolder README would restate them
no-readme ducking_core.egg-info # generated by setuptools on install/build; not hand-maintained
no-readme .mypy_cache/3.11      # generated by mypy; not hand-maintained
no-readme .pytest_cache/v/cache # generated by pytest; not hand-maintained, not git-tracked
no-readme scripts               # single deploy script (deploy-hf.sh); self-explanatory
